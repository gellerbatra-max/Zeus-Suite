[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marker-making-service"
version = "0.1.0"
description = "Marker Making & Production Output - Phase 2 core (thin client over data-platform-api)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "psycopg[binary]>=3.1",
    "azure-storage-blob>=12.20",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# B008: flake8-bugbear flags function calls in argument defaults, but FastAPI's own docs
# prescribe exactly `= Depends(...)` as the idiomatic pattern -- ignored here rather than
# rewritten away from a pattern the framework itself recommends.
ignore = ["B008"]
