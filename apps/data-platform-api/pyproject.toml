[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-platform-api"
version = "0.1.0"
description = "Data Management Platform API - foundation service of the Zeus Suite"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "azure-storage-blob>=12.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# B008: flake8-bugbear flags function calls in argument defaults, but FastAPI's own docs
# prescribe exactly `= Depends(...)` / `= Query(...)` as the idiomatic pattern -- ignored here
# rather than rewritten away from a pattern the framework itself recommends.
ignore = ["B008"]
