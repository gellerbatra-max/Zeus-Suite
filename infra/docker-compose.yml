services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: zeus
      POSTGRES_PASSWORD: zeus
      POSTGRES_DB: zeus_suite
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeus -d zeus_suite"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Azure Blob Storage emulator. Not consumed by any code yet — wired up ahead of
  # Milestone 2 (object storage integration / SAS URL issuance).
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: "azurite-blob --blobHost 0.0.0.0 --blobPort 10000"
    ports:
      - "10000:10000"
    volumes:
      - azurite-data:/data

volumes:
  postgres-data:
  azurite-data:
